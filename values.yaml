# -- Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# -- Organization details used for certificate generation
organization:
  name: "OpenUEM"
  province: "Valladolid"
  locality: "Valladolid"
  address: ""
  country: "ES"
  domain: "openuem.example"

# -- Certificate initialization Job
certInit:
  image:
    repository: openuem/openuem-cert-manager
    tag: "latest"
    pullPolicy: Always
  # -- Reverse proxy server hostname (optional)
  reverseProxyServer: ""
  # -- Extra SANs for the NATS server certificate, on top of the internal
  # hostname and the image's built-in nats-server/localhost.
  #
  # Agents verify the NATS hostname against this certificate, so any name they
  # dial has to be here — publishing NATS through an ingress is not enough on
  # its own. Kept separate from natsConfig.hostname deliberately: that value
  # also builds NATS_SERVERS, so overriding it would send in-cluster clients out
  # to the public name.
  #
  # The cert-init image only mints a certificate when one is absent, so adding a
  # name here does not rotate an existing certificate. See the README.
  natsExtraDnsNames: []
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  resources: {}
  persistence:
    storageClass: ""
    size: 256Mi
    accessModes:
      - ReadWriteOnce
    # -- Fixed PVC name (required for NATS subchart static reference)
    claimName: openuem-certs

# -- Inline PostgreSQL deployment
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  auth:
    username: openuem
    password: openuem
    database: openuem
    # -- Use an existing Secret for POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    existingSecret: ""
  port: 5432
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  resources: {}

# -- Opt-in CloudNativePG cluster. Requires the CloudNativePG operator
# (https://cloudnative-pg.io/) to be installed in the cluster. Mutually
# exclusive with `postgresql.enabled` — set that to false when enabling this.
# When enabled, the chart wires DATABASE_URL to the cluster's `-rw` Service
# and reads the owner credentials from the CNPG-generated `-app` Secret.
cnpg:
  enabled: false
  # -- Cluster name (default: <release-fullname>-pg)
  name: ""
  instances: 1
  # -- CloudNativePG PostgreSQL image
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  # -- Database and owner created by the initdb bootstrap
  database: openuem
  owner: openuem
  # -- Existing Secret holding the owner credentials (basic-auth type, with
  # `username`/`password` keys). When empty, CloudNativePG generates
  # `<cluster>-app` and the chart reads it from there.
  existingSecret: ""
  # -- Grant access to the `postgres` superuser via a generated Secret
  enableSuperuserAccess: false
  # -- Rolling update strategy for the primary instance
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
    storageClass: ""
  # -- Dedicated volume for write-ahead logs
  walStorage:
    enabled: false
    size: 2Gi
    storageClass: ""
  # -- PostgreSQL server parameters (spec.postgresql.parameters)
  parameters: {}
  monitoring:
    enablePodMonitor: false
  resources: {}
  # -- CloudNativePG affinity settings (spec.affinity)
  affinity: {}
  # -- Backup configuration passed through to spec.backup (e.g. barmanObjectStore)
  backup: {}
  # -- Extra fields merged into spec (escape hatch for options not exposed above)
  extraSpec: {}
  annotations: {}
  labels: {}

# -- External database settings (used when postgresql.enabled=false)
externalDatabase:
  host: ""
  port: 5432
  username: ""
  password: ""
  database: ""
  # -- Full connection URL override (takes precedence when existingSecret is unset)
  url: ""
  # -- Existing Secret holding database credentials. Compatible with
  # CloudNativePG-managed secrets (basic-auth type, with `username` and
  # `password` keys). The chart reads username/password from the secret and
  # composes DATABASE_URL at container start using `host`, `port`, and
  # `database` from above.
  existingSecret: ""
  # -- Key names within existingSecret (defaults match CNPG's basic-auth layout)
  existingSecretUsernameKey: username
  existingSecretPasswordKey: password

# -- OCSP Responder
ocspResponder:
  image:
    repository: openuem/openuem-ocsp-responder
    tag: "latest"
    pullPolicy: Always
  port: 8000
  # -- Override hostname (default: ocsp.<domain>)
  hostname: ""
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
    nodePort: null
  resources: {}

# -- NATS subchart configuration
nats:
  enabled: true
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 5Gi
    nats:
      port: 4433
      tls:
        enabled: true
        merge:
          cert_file: /etc/openuem-certs/certificates/nats/nats.cer
          key_file: /etc/openuem-certs/certificates/nats/nats.key
          ca_file: /etc/openuem-certs/certificates/ca/ca.cer
  # The NATS subchart applies `merge` with Helm's mergeOverwrite, which REPLACES
  # lists rather than appending to them. Anything that adds to an existing list
  # — volumes, volumeMounts — must go through `patch` (RFC 6902, applied after
  # the merge) or it silently erases the subchart's own entries. Injecting the
  # cert PVC via `merge` wiped the `config` and `pid` volumes and the JetStream
  # mount, which left the reloader mounting a `pid` volume that no longer
  # existed and made the API server reject every openuem-nats-0 pod.
  #
  # `initContainers` stays on `merge`: the subchart defines none, so there is no
  # list to clobber, and `add /spec/initContainers/-` would fail against an
  # array that does not exist yet.
  podTemplate:
    merge:
      spec:
        initContainers:
          - name: wait-for-certs
            image: busybox:1.36
            command: ["/bin/sh", "-c"]
            args:
              - |
                while [ ! -f /etc/openuem-certs/certificates/ca/ca.cer ]; do
                  echo "Waiting for certificates..."
                  sleep 5
                done
            volumeMounts:
              - name: openuem-certs
                mountPath: /etc/openuem-certs
                readOnly: true
    patch:
      - op: add
        path: /spec/volumes/-
        value:
          name: openuem-certs
          persistentVolumeClaim:
            claimName: openuem-certs
            readOnly: true
  container:
    # Rooted at the container object, so no /spec prefix — unlike podTemplate.
    patch:
      - op: add
        path: /volumeMounts/-
        value:
          name: openuem-certs
          mountPath: /etc/openuem-certs
          readOnly: true

# -- NATS connection settings
natsConfig:
  port: 4433
  # -- Override hostname (default: nats.<domain>)
  hostname: ""

# -- Worker deployments
workers:
  image:
    repository: openuem/openuem-worker
    tag: "latest"
    pullPolicy: Always
  notification:
    enabled: true
    replicaCount: 1
    resources: {}
  certManager:
    enabled: true
    replicaCount: 1
    resources: {}
  agents:
    enabled: true
    replicaCount: 1
    resources: {}

# -- Console web UI
console:
  image:
    repository: openuem/openuem-console
    tag: "latest"
    pullPolicy: Always
  port: 1323
  authPort: 1324
  # -- Override hostname (default: console.<domain>)
  hostname: ""
  jwtKey: "averylongsecret"
  # -- Use an existing Secret for JWT_KEY
  existingSecret: ""
  reverseProxyAuthPort: ""
  reverseProxyServer: ""
  reEnableCertificatesAuth: ""
  reEnablePasswdAuth: ""
  resetOpenuemUser: ""
  replicaCount: 1
  service:
    type: ClusterIP
    port: 1323
    authPort: 1324
  resources: {}

# -- Ingress for console (disabled by default)
ingress:
  enabled: false
  className: ""
  annotations: {}
  # -- Host rules (required when ingress.enabled=true)
  hosts: []
  #  - host: console.example.com
  #    paths:
  #      - path: /
  #        pathType: Prefix
  #        port: 1323
  #  - host: auth.example.com
  #    paths:
  #      - path: /
  #        pathType: Prefix
  #        port: 1324
  tls: []

# -- Traefik IngressRoute for console (disabled by default)
traefik:
  ingressRoute:
    enabled: false
    # -- API version of the IngressRoute CRD (e.g. traefik.io/v1alpha1, traefik.containo.us/v1alpha1)
    apiVersion: traefik.io/v1alpha1
    annotations: {}
    entryPoints:
      - websecure
    # -- Console UI route (forwarded to console.service.port)
    console:
      # -- Host name (required when traefik.ingressRoute.enabled=true)
      host: ""
      tls:
        # -- Traefik cert resolver name (e.g. "letsencrypt")
        certResolver: ""
        # -- Existing TLS Secret name (mutually exclusive with certResolver)
        secretName: ""
    # -- Auth endpoint route (forwarded to console.service.authPort)
    auth:
      # -- Host name (required when traefik.ingressRoute.enabled=true)
      host: ""
      tls:
        # -- Traefik cert resolver name (e.g. "letsencrypt")
        certResolver: ""
        # -- Existing TLS Secret name (mutually exclusive with certResolver)
        secretName: ""
  # -- Opt-in SNI-routed TCP passthrough for NATS, so agents outside the
  # cluster's private network can reach the message broker over the same TLS
  # entrypoint as the HTTP routes. No certificate is configured here: Traefik
  # does not terminate TLS, NATS presents its own OpenUEM-CA certificate, and
  # the agent's client certificate reaches the server intact.
  #
  # Routes the WebSocket listener, so it requires nats.config.websocket.enabled.
  # The raw NATS port cannot be SNI-routed: the server sends a plaintext INFO
  # line before any TLS handshake, so Traefik never sees a ClientHello to read
  # the SNI from. wss:// is TLS from the first byte.
  #
  # This route authenticates nothing by itself. Set
  # `nats.config.websocket.tls.merge.verify: true` before enabling it, or NATS
  # accepts any client that completes a TLS handshake.
  ingressRouteTCP:
    enabled: false
    # -- API version of the IngressRouteTCP CRD (e.g. traefik.io/v1alpha1,
    # traefik.containo.us/v1alpha1)
    apiVersion: traefik.io/v1alpha1
    annotations: {}
    entryPoints:
      - websecure
    nats:
      # -- Host name agents connect to (required when enabled). Must also be
      # listed in certInit.natsExtraDnsNames so it is a SAN on the NATS
      # certificate; the chart refuses to render otherwise.
      host: ""
      # -- Backend Service. Defaults to the NATS subchart's <release>-nats.
      service: ""
      # -- Backend Service port. Defaults to nats.config.websocket.port.
      port: ""

# -- Opt-in ExternalDNS records (DNSEndpoint CRD) for the chart's hostnames.
# Requires ExternalDNS to be installed in the cluster with the `crd` source
# enabled (https://kubernetes-sigs.github.io/external-dns/).
externalDns:
  enabled: false
  # -- IP or hostname the records resolve to. Required when enabled.
  target: ""
  # -- A for IP targets, CNAME for hostname targets
  recordType: A
  recordTTL: 300
  # -- Cloudflare-only, ignored by other providers. Whether the record is
  # proxied (orange-cloud).
  cloudflareProxied: false
  # -- Hostnames to publish. When empty, they are derived from the Traefik
  # IngressRoute hosts (console + auth) and `ingress.hosts`.
  hosts: []

# -- ServiceAccount
serviceAccount:
  create: true
  name: ""
  annotations: {}
